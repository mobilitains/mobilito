<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mobilito — Server error</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      text-align: center;
      padding: 4rem 1rem;
      color: #212529;
    }
    a { color: #0d6efd; }
  </style>
</head>
<body>
  <h1>Something went wrong</h1>
  <p>Sorry — something broke on our end. Please try again shortly.</p>
  <p><a href="/">Back to Mobilito</a></p>
  <hr>
  <h1>Une erreur est survenue</h1>
  <p>Désolé, quelque chose s'est mal passé de notre côté. Merci de réessayer dans un instant.</p>
  <p><a href="/">Retour à Mobilito</a></p>
</body>
</html>
