name: Check PR title

on:
  pull_request:
    branches: [main]

jobs:
  check-title:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Check PR title
        run: |
          chmod +x .github/check_commit.py
          .github/check_commit.py
