name: Check PR title

on:
  pull_request:
    branches: [main]

jobs:
  check-title:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check PR title
        run: |
          chmod +x .github/check_commit.py
          .github/check_commit.py
