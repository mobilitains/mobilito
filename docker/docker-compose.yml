services:
  db:
    image: postgis/postgis:18-3.6
    environment:
      POSTGRES_DB: mobilito
      POSTGRES_USER: mobilito
      POSTGRES_PASSWORD: mobilito
    volumes:
      # PostgreSQL 18 images keep data in a versioned subdirectory
      # of /var/lib/postgresql. A new volume name leaves the old
      # PostgreSQL 15 data (postgres_data) untouched.
      - postgres18_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mobilito"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ..:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_DB: mobilito
      POSTGRES_USER: mobilito
      POSTGRES_PASSWORD: mobilito
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"

  # Long-lived container for interactive development shells.
  # Start with: ./docker/docker-manage.sh sh
  dev-sh:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: sleep infinity
    volumes:
      - ..:/app
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_DB: mobilito
      POSTGRES_USER: mobilito
      POSTGRES_PASSWORD: mobilito
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"

volumes:
  postgres18_data:
